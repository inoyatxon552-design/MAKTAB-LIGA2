<!DOCTYPE html>
<html lang="uz"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Test Liga</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<style>
:root{--bg:#0f172a;--card:#1e293b;--tx:#e2e8f0;--mut:#94a3b8;--ac:#22c55e;--bd:#334155}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,sans-serif;background:var(--bg);color:var(--tx)}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 20px;background:#020617;position:sticky;top:0;z-index:5}
.wrap{display:grid;grid-template-columns:1fr 380px;gap:16px;padding:16px;max-width:1300px;margin:auto}
@media(max-width:900px){.wrap{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:16px;margin-bottom:16px}
h2,h3{margin:0 0 10px}input,select,textarea{background:#0b1220;color:var(--tx);border:1px solid var(--bd);border-radius:8px;padding:9px;font:inherit;max-width:100%}
button{background:var(--ac);color:#04210f;border:0;border-radius:8px;padding:9px 14px;font-weight:700;cursor:pointer}
button.g{background:#334155;color:var(--tx)}button.r{background:#ef4444;color:#fff}
table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:6px 8px;border-bottom:1px solid var(--bd);text-align:left}
.sc{overflow-x:auto;max-height:420px;overflow-y:auto}
.q{padding:12px;border:1px solid var(--bd);border-radius:10px;margin-bottom:10px}
.q label{display:block;padding:6px;border-radius:6px;cursor:pointer}.q label:hover{background:#334155}
.lb tr.me{background:#14532d}.lb tr:nth-child(1) td:first-child{color:#facc15;font-weight:800}
.lb tr:nth-child(2) td:first-child{color:#cbd5e1;font-weight:800}.lb tr:nth-child(3) td:first-child{color:#fb923c;font-weight:800}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:8px 0}
#v-login{max-width:340px;margin:12vh auto}#v-login input{width:100%;margin-bottom:10px}
.timer{font-size:22px;font-weight:800;color:#facc15}
</style></head><body>
<div id="app" hidden></div>

<div id="v-login" class="card" hidden>
  <h2 id="ltitle"></h2><input id="lg" placeholder="Login"><input id="pw" type="password" placeholder="Parol">
  <button onclick="login()" style="width:100%">Kirish</button><button id="rb" class="g" onclick="reg()" style="width:100%;margin-top:8px" hidden>Admin sifatida ro'yxatdan o'tish</button><p id="lerr" class="mut"></p><p class="mut"><a href="#" id="lsw" style="color:#94a3b8"></a></p>
</div>

<div id="main" hidden>
<header><b>🏆 Test Liga</b><span><span id="who" class="mut"></span> <button class="g" onclick="logout()">Chiqish</button></span></header>
<div class="wrap">
 <div>
  <!-- ADMIN -->
  <div id="v-admin" hidden>
   <div class="card"><h3>1. O'quvchilar</h3>
    <div class="row"><button class="g" onclick="tpl()">⬇ Shablon (CSV)</button>
    <input type="file" id="fs" accept=".xlsx,.xls,.csv"><button onclick="impStudents()">Import + login/parol yaratish</button></div>
    <div class="mut">Shablon: 1-ustun — Ism Familiya, 2-ustun — Sinf. <span id="sprog"></span></div>
    <div class="row"><input id="an" placeholder="Ism Familiya" style="flex:1;min-width:160px"><input id="ac" placeholder="Sinf (masalan 5-A)" style="width:140px"><button onclick="addStudent()">+ O'quvchi qo'shish</button></div><div id="aprog" class="mut"></div>
    <div class="row"><button class="g" onclick="dlCreds()">⬇ Login/parollarni yuklash</button><button class="g" onclick="window.print()">🖨 Chop etish</button></div>
    <div class="sc"><table><thead><tr><th>Ism</th><th>Sinf</th><th>Login</th><th>Parol</th></tr></thead><tbody id="stl"></tbody></table></div>
   </div>
   <div class="card"><h3>2. Testlar</h3>
    <div class="mut">Format: <code>#Savol</code>, so'ng <code>-noto'g'ri</code> va <code>+to'g'ri</code> variantlar (.txt, UTF-8)</div>
    <div class="row"><input type="file" id="ft" accept=".txt"><button onclick="impTest()">Testni import qilish</button></div>
    <div id="tl"></div>
   </div>
   <div class="card"><h3>3. Sessiya (start)</h3>
    <div class="row"><select id="st"></select>
    <input id="sn" type="number" min="1" placeholder="Savollar soni" style="width:140px">
    <input id="sm" type="number" min="1" placeholder="Vaqt (daqiqa)" style="width:140px"></div>
    <div class="row"><button onclick="startS()">▶ Start</button><button class="r" onclick="stopS()">■ To'xtatish</button></div>
    <div id="sinfo" class="mut"></div>
   </div>
  </div>
  <div id="v-stu" hidden><div class="card" id="stu">Yuklanmoqda...</div></div>
 </div>
 <div class="card"><h3>📊 Umumiy natijalar (jonli)</h3><div class="sc"><table class="lb"><thead><tr><th>#</th><th>O'quvchi</th><th>Sinf</th><th>Ball</th><th>Vaqt</th></tr></thead><tbody id="lb"></tbody></table></div></div>
</div></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,signInWithEmailAndPassword,createUserWithEmailAndPassword,signOut,deleteUser,onAuthStateChanged} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,doc,setDoc,getDoc,addDoc,deleteDoc,collection,onSnapshot,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

/* ====== SHU YERNI TO'LDIRING ====== */
const cfg={apiKey:"AIzaSyCJfTeVa7O5-dyv7uHJQOeF4vvQmvbZFbw",authDomain:"sinf-monitoring.firebaseapp.com",projectId:"sinf-monitoring",storageBucket:"sinf-monitoring.firebasestorage.app",messagingSenderId:"209170669749",appId:"1:209170669749:web:2f5bfc53b04df5da31defc",measurementId:"G-JSDYWSE1S1"};
const DOMAIN="@maktab.uz";             // o'quvchi loginlari uchun
/* =================================== */

const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),auth2=getAuth(initializeApp(cfg,"sec"));
const $=i=>document.getElementById(i),esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const mail=l=>l.includes('@')?l:l.toLowerCase()+DOMAIN;
const shuffle=a=>{a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
let me,prof,isAdm,sess=null,results=[],students=[],creds={},tests=[],unsub=[],unsubR,taking=false,tmr;

let adminMode=location.hash=='#admin',regBusy=false;
const chkAdm=async u=>{try{const d=await getDoc(doc(db,'config','admin'));return d.exists()&&d.data().uid===u.uid}catch(e){return false}};
function setMode(){$('ltitle').textContent=adminMode?'🔐 Admin kirishi':'🏆 Test Liga';$('lg').placeholder=adminMode?'Admin email':'Login';$('rb').hidden=!adminMode;$('lsw').textContent=adminMode?"← O'quvchi kirishi":"Admin kirishi →"}
$('lsw').onclick=e=>{e.preventDefault();adminMode=!adminMode;history.replaceState(null,'',adminMode?'#admin':location.pathname);setMode()};setMode();
window.login=async()=>{$('lerr').textContent='';
  try{const c=await signInWithEmailAndPassword(auth,mail($('lg').value.trim()),$('pw').value);
    if((await chkAdm(c.user))!==adminMode){await signOut(auth);$('lerr').textContent=adminMode?"Bu bo'lim faqat admin uchun":"Admin bo'lsangiz «Admin kirishi» bo'limidan kiring"}
  }catch(e){$('lerr').textContent="Login yoki parol noto'g'ri"}};
window.reg=async()=>{const E=m=>$('lerr').textContent=m;E('');const l=$('lg').value.trim(),p=$('pw').value;
  if(!l||p.length<6)return E("Login kiriting, parol kamida 6 belgi bo'lsin");
  regBusy=true;let c;
  try{c=await createUserWithEmailAndPassword(auth,mail(l),p)}catch(e){regBusy=false;
    return E({'auth/email-already-in-use':"Bu login band (yoki avval yaratilgan). «Kirish» ni bosing",'auth/operation-not-allowed':"Firebase → Authentication → Email/Password yoqilmagan",'auth/weak-password':"Parol kuchsiz (kamida 6 belgi)",'auth/invalid-api-key':"cfg dagi apiKey noto'g'ri"}[e.code]||('Xato: '+(e.code||e.message)))}
  let msg;
  try{if((await getDoc(doc(db,'config','admin'))).exists())msg="Admin allaqachon ro'yxatdan o'tgan. «Kirish» tugmasini bosing.";
    else{await setDoc(doc(db,'config','admin'),{uid:c.user.uid,email:c.user.email});location.reload();return}}
  catch(e){msg=e.code=='permission-denied'?"Firestore Rules yangilanmagan (Rules → Publish qiling)":'Firestore xatosi: '+(e.code||e.message)+" (Firestore Database yaratilganmi?)"}
  try{await deleteUser(c.user)}catch(e){}regBusy=false;E(msg)};
window.logout=()=>signOut(auth);

onAuthStateChanged(auth,async u=>{
  if(regBusy)return;
  unsub.forEach(f=>f());unsub=[];unsubR&&unsubR();clearInterval(tmr);taking=false;me=u;
  $('v-login').hidden=!!u;$('main').hidden=!u;if(!u)return;
  isAdm=await chkAdm(u);$('v-admin').hidden=!isAdm;$('v-stu').hidden=isAdm;
  if(!isAdm){const sd=await getDoc(doc(db,'students',u.uid));prof=sd.data()||{name:u.email,cls:''}}
  $('who').textContent=isAdm?'Admin':prof.name+' ('+prof.cls+')';
  unsub.push(onSnapshot(doc(db,'config','session'),s=>{const n=s.exists()?s.data():null;const ch=!sess||!n||sess.id!==n.id;sess=n;if(ch)subRes();isAdm?renderSess():renderStu()},e=>{const m='Sessiyani o\'qib bo\'lmadi: '+(e.code||e.message)+(e.code=='permission-denied'?' — Firestore Rules ni Publish qiling':'');isAdm?$('sinfo').textContent=m:$('stu').innerHTML='<h3>⚠️ '+m+'</h3>'}));
  if(isAdm){
    unsub.push(onSnapshot(collection(db,'students'),s=>{students=s.docs.map(d=>({id:d.id,...d.data()}));renderSt()}));
    unsub.push(onSnapshot(collection(db,'creds'),s=>{creds={};s.docs.forEach(d=>creds[d.id]=d.data().password);renderSt()}));
    unsub.push(onSnapshot(collection(db,'tests'),s=>{tests=s.docs.map(d=>({id:d.id,...d.data()}));renderTests()}));
  }
});
function subRes(){unsubR&&unsubR();results=[];renderLB();if(!sess)return;
  unsubR=onSnapshot(query(collection(db,'results'),where('sid','==',sess.id)),s=>{results=s.docs.map(d=>d.data());renderLB();if(!isAdm&&!taking)renderStu();},e=>console.error('results',e))}

function fmt(s){return Math.floor(s/60)+':'+String(s%60).padStart(2,'0')}
function renderLB(){
  const r=[...results].sort((a,b)=>b.score-a.score||a.sec-b.sec);
  $('lb').innerHTML=r.map((x,i)=>`<tr class="${me&&x.uid===me.uid?'me':''}"><td>${i+1}</td><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td><b>${x.score}</b>/${x.total}</td><td>${fmt(x.sec)}</td></tr>`).join('')||'<tr><td colspan=5 class="mut">Hali natija yo\'q</td></tr>';
}

/* ---------- ADMIN: o'quvchilar ---------- */
window.tpl=()=>dl('shablon.csv','Ism Familiya,Sinf\nAliyev Vali,9-A\nKarimova Nilufar,9-B\n');
function dl(n,t){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob(['\ufeff'+t],{type:'text/csv'}));a.download=n;a.click()}
const rnd=(n,set)=>Array.from({length:n},()=>set[Math.random()*set.length|0]).join('');
window.impStudents=async()=>{
  const f=$('fs').files[0];if(!f)return alert('Fayl tanlang');
  const wb=XLSX.read(await f.arrayBuffer());
  let rows=XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]],{header:1}).filter(r=>r[0]);
  if(rows.length&&/sinf|class/i.test(rows[0][1]||''))rows.shift();
  const used=new Set(students.map(s=>s.login));let ok=0;
  for(const r of rows){
    let login;do{login='u'+rnd(4,'0123456789')}while(used.has(login));used.add(login);
    const pass=rnd(6,'abcdefghjkmnpqrstuvwxyz23456789');
    try{
      const c=await createUserWithEmailAndPassword(auth2,mail(login),pass);await signOut(auth2);
      await setDoc(doc(db,'students',c.user.uid),{name:String(r[0]).trim(),cls:String(r[1]||'').trim(),login});
      await setDoc(doc(db,'creds',c.user.uid),{password:pass});ok++;
      $('sprog').textContent=` ${ok}/${rows.length} yaratildi...`;
    }catch(e){console.error(e);alert('Xato: '+e.message);break}
  }
  $('sprog').textContent=` Tayyor: ${ok} ta o'quvchi.`;
};
window.addStudent=async()=>{
  const name=$('an').value.trim(),cls=$('ac').value.trim(),P=$('aprog');
  if(!name)return P.textContent="Ism Familiyani yozing";
  const used=new Set(students.map(s=>s.login));let login;do{login='u'+rnd(4,'0123456789')}while(used.has(login));
  const pass=rnd(6,'abcdefghjkmnpqrstuvwxyz23456789');P.textContent='Qo\'shilmoqda...';
  try{
    const c=await createUserWithEmailAndPassword(auth2,mail(login),pass);await signOut(auth2);
    await setDoc(doc(db,'students',c.user.uid),{name,cls,login});
    await setDoc(doc(db,'creds',c.user.uid),{password:pass});
    P.textContent=`✅ ${name} qo'shildi. Login: ${login}  Parol: ${pass}`;$('an').value='';$('ac').value='';
  }catch(e){P.textContent='Xato: '+(e.code||e.message)}
};
function renderSt(){
  const s=[...students].sort((a,b)=>a.cls.localeCompare(b.cls)||a.name.localeCompare(b.name));
  $('stl').innerHTML=s.map(x=>`<tr><td>${esc(x.name)}</td><td>${esc(x.cls)}</td><td>${x.login}</td><td>${creds[x.id]||''}</td></tr>`).join('');
}
window.dlCreds=()=>dl('login_parol.csv','Ism,Sinf,Login,Parol\n'+students.map(x=>[x.name,x.cls,x.login,creds[x.id]||''].map(v=>`"${v}"`).join(',')).join('\n'));

/* ---------- ADMIN: testlar ---------- */
function parseTest(txt){const qs=[];let c=null;
  for(let l of txt.split(/\r?\n/)){l=l.trim();if(!l)continue;const h=l[0],r=l.slice(1).trim();
    if(h=='#'){c={q:r,o:[],c:-1};qs.push(c)}
    else if(c&&(h=='-'||h=='+')){c.o.push(r);if(h=='+')c.c=c.o.length-1}
    else if(c&&!c.o.length)c.q+=' '+l}
  return qs.filter(q=>q.o.length>1&&q.c>=0)}
window.impTest=async()=>{
  const f=$('ft').files[0];if(!f)return alert('Fayl tanlang');
  const qs=parseTest(await f.text());if(!qs.length)return alert("Savollar topilmadi. Formatni tekshiring.");
  await addDoc(collection(db,'tests'),{title:f.name.replace(/\.txt$/i,''),questions:qs,at:serverTimestamp()});
  alert(qs.length+' ta savol import qilindi');
};
function renderTests(){
  $('tl').innerHTML=tests.map(t=>`<div class="row"><b>${esc(t.title)}</b> <span class="mut">${t.questions.length} ta savol</span><button class="g" onclick="delTest('${t.id}')">O'chirish</button></div>`).join('');
  const v=$('st').value;$('st').innerHTML=tests.map(t=>`<option value="${t.id}">${esc(t.title)} (${t.questions.length})</option>`).join('');if(v)$('st').value=v;
}
window.delTest=id=>confirm("O'chirilsinmi?")&&deleteDoc(doc(db,'tests',id));

/* ---------- ADMIN: sessiya ---------- */
window.startS=async()=>{
  const t=tests.find(x=>x.id==$('st').value);if(!t)return alert('Test tanlang');
  const n=Math.min(+$('sn').value||t.questions.length,t.questions.length),m=+$('sm').value||20;
  await setDoc(doc(db,'config','session'),{id:String(Date.now()),testId:t.id,title:t.title,count:n,minutes:m,active:true});
};
window.stopS=()=>sess&&setDoc(doc(db,'config','session'),{...sess,active:false});
function renderSess(){$('sinfo').textContent=sess?`${sess.active?'🟢 FAOL':'🔴 To\'xtatilgan'}: ${sess.title} — ${sess.count} savol, ${sess.minutes} daqiqa`:'Sessiya yo\'q'}

/* ---------- O'QUVCHI ---------- */
const key=()=>`att_${sess.id}_${me.uid}`;
function renderStu(){
  if(taking)return;const el=$('stu');
  if(!sess||!sess.active)return el.innerHTML='<h3>Hozircha faol test yo\'q</h3><p class="mut">Admin test boshlaganda shu yerda tugma paydo bo\'ladi.</p>';
  const mine=results.find(r=>r.uid===me.uid);
  if(mine)return el.innerHTML=`<h3>✅ Test topshirildi</h3><p>Natija: <b>${mine.score}/${mine.total}</b>, vaqt: ${fmt(mine.sec)}. Reytingni o'ngda ko'ring.</p>`;
  if(localStorage.getItem(key()))return showTest(JSON.parse(localStorage.getItem(key())));
  el.innerHTML=`<h3>${esc(sess.title)}</h3><p>${sess.count} ta savol • ${sess.minutes} daqiqa. Boshlagach vaqt ketadi, faqat bir marta topshiriladi.</p><button onclick="begin()">▶ Boshlash</button>`;
}
window.begin=async()=>{
  const t=(await getDoc(doc(db,'tests',sess.testId))).data();
  const qs=shuffle(t.questions).slice(0,sess.count).map(q=>({q:q.q,o:shuffle(q.o.map((x,i)=>({t:x,c:i==q.c})))}));
  const a={start:Date.now(),qs};localStorage.setItem(key(),JSON.stringify(a));showTest(a);
};
function showTest(a){
  taking=true;const end=a.start+sess.minutes*60000;
  $('stu').innerHTML=`<div class="row"><h3 style="flex:1">${esc(sess.title)}</h3><span class="timer" id="tm"></span></div>`+
   a.qs.map((q,i)=>`<div class="q"><b>${i+1}. ${esc(q.q)}</b>${q.o.map((o,j)=>`<label><input type="radio" name="q${i}" value="${j}"> ${esc(o.t)}</label>`).join('')}</div>`).join('')+
   `<button onclick="finish()">Yakunlash</button>`;
  window.finish=async()=>{
    clearInterval(tmr);let sc=0;
    a.qs.forEach((q,i)=>{const c=document.querySelector(`input[name=q${i}]:checked`);if(c&&q.o[+c.value].c)sc++});
    const sec=Math.min(Math.round((Date.now()-a.start)/1000),sess.minutes*60),sid=sess.id;
    try{await setDoc(doc(db,'results',sid+'_'+me.uid),{sid,uid:me.uid,name:prof.name,cls:prof.cls,score:sc,total:a.qs.length,sec,at:serverTimestamp()});
      localStorage.removeItem(`att_${sid}_${me.uid}`)}catch(e){alert('Xato: '+e.message);return}
    taking=false;renderStu();
  };
  const tick=()=>{const r=Math.max(0,Math.round((end-Date.now())/1000));$('tm').textContent='⏱ '+fmt(r);if(r<=0){clearInterval(tmr);window.finish()}};
  tick();tmr=setInterval(tick,500);
}
</script>
</body></html>
